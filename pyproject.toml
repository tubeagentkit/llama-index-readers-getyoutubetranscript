[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llama-index-readers-getyoutubetranscript"
version = "0.1.0"
description = "YouTube transcript reader for LlamaIndex: load YouTube video transcripts (optionally with timestamps) as Documents for RAG, via the GetYouTubeTranscript API. Works from cloud servers without proxies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "tubeagentkit" }]
keywords = ["llama-index", "llamaindex", "llama-index-readers", "reader", "youtube", "youtube-transcript", "transcript", "captions", "subtitles", "agents", "rag", "llm", "tools", "data-loader"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "llama-index-core>=0.13.0,<0.15",
    "getyoutubetranscript>=0.3.0,<1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Homepage = "https://getyoutubetranscript.com"
Documentation = "https://github.com/tubeagentkit/llama-index-readers-getyoutubetranscript#readme"
Repository = "https://github.com/tubeagentkit/llama-index-readers-getyoutubetranscript"
"API reference" = "https://getyoutubetranscript.com/docs"
"Get an API key" = "https://getyoutubetranscript.com/dashboard"

[tool.hatch.build.targets.wheel]
packages = ["llama_index"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
